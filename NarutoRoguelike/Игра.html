// Паттерн: [N, D1, D2, D3, D4] × 2 = 10 волн, потом N, потом BOSS = 12
// Простое чередование: N → D → N → D → ... , каждая 12-я = BOSS
// defenseWave здесь = 1 (начальный раунд); внутри D он растёт до 4
function getPhaseInfo(w){
  if(w%BOSS_EVERY===0) return {phase:'boss', defenseWave:0};
  // Паттерн: N D N D N D N D N D → 10 волн, потом N, потом BOSS
  // 11-я = normal, 12-я = boss. Каждая чётная (кроме 12) = defense.
  return (w%2===1) ? {phase:'normal',defenseWave:0} : {phase:'defense',defenseWave:1};
}

}

function sfx(freq=440,dur=0.1,vol=0.12,waveType='sine',sweep=0){
  if(!AC||audioMuted)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=waveType;o.frequency.setValueAtTime(freq,AC.currentTime);
    if(sweep!==0)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*sweep),AC.currentTime+dur);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const dist2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;};
function pointSegmentDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;const l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(px-x1,py-y1);let t=((px-x1)*dx+(py-y1)*dy)/l2;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}
function angleDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function fisherYates(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function findNearestTarget(from,maxDist=Infinity){let best=null,bd=maxDist===Infinity?Infinity:maxDist*maxDist;for(const e of enemies){if(e.removed)continue;const d=dist2(from,e);if(d<bd){bd=d;best=e;}}for(const b of bosses){if(b.removed)continue;const d=dist2(from,b);if(d<bd){bd=d;best=b;}}return best;}
function findNearestUnlinkedTarget(from,maxDist,owner){
  const maxR2=maxDist===Infinity?Infinity:maxDist*maxDist;
  let best=null,bd=maxR2;
  for(const e of enemies){
    if(e.removed)continue;
    if(owner&&e.shadowWebTimer>0&&e.shadowWebOwner===owner)continue;
    const d=dist2(from,e);
    if(d<bd){bd=d;best=e;}
  }
  for(const b of bosses){
    if(b.removed)continue;
    if(owner&&b.shadowWebTimer>0&&b.shadowWebOwner===owner)continue;
    const d=dist2(from,b);
    if(d<bd){bd=d;best=b;}
  }
  return best;
}
function findNearestPlayer(from,maxDist=Infinity){
  let best=null,bd=maxDist===Infinity?Infinity:maxDist*maxDist;
  for(const p of players){
    if(!p.alive||p.vanishedTimer>0||p.sakuraJumpActive)continue;
    const d=dist2(from,p);if(d<bd){bd=d;best=p;}
	
  }
  return best;
}
function getTargetsInRadius(from,radius){const r2=radius*radius;const list=[];for(const e of enemies){if(e.removed)continue;if(dist2(from,e)<r2)list.push(e);}for(const b of bosses){if(b.removed)continue;if(dist2(from,b)<r2)list.push(b);}return list;}
function findTargetInCone(from,aim,range,halfCone=Math.PI/2.5){const rangeSq=range===Infinity?Infinity:range*range;let best=null,bestScore=-Infinity;const check=(e)=>{if(e.removed)return;const dx=e.x-from.x,dy=e.y-from.y;const d2=dx*dx+dy*dy;if(d2>rangeSq)return;const d=Math.sqrt(d2)||1;const ang=Math.atan2(dy,dx);const diff=Math.abs(angleDiff(ang,aim));if(diff>halfCone)return;const score=(1-diff/halfCone)*10-d/Math.max(range===Infinity?1000:range,1);if(score>bestScore){bestScore=score;best=e;}};for(const e of enemies)check(e);for(const b of bosses)check(b);return best;}
function getAllTargetsInCone(from,aim,range,halfCone=Math.PI/2.5){const rangeSq=range===Infinity?Infinity:range*range;const list=[];const check=(e)=>{if(e.removed)return;const dx=e.x-from.x,dy=e.y-from.y;const d2=dx*dx+dy*dy;if(d2>rangeSq)return;const ang=Math.atan2(dy,dx);if(Math.abs(angleDiff(ang,aim))>halfCone)return;list.push({e,d2});};for(const e of enemies)check(e);for(const b of bosses)check(b);list.sort((a,b)=>a.d2-b.d2);return list.map(x=>x.e);}
const _particlePool=[],_damageNumberPool=[];
function emitParticle(x,y,vx,vy,life,color,r){

function emitDamageNumber(x,y,vy,life,amount,color,isCrit,offset){
  if(damageNumbers.length>150)return;
  let d=_damageNumberPool.pop();if(!d)d={x:0,y:0,vy:0,life:0,maxLife:0,amount:0,color:'#fff',isCrit:false,offset:0};d.x=x;d.y=y;d.vy=vy;d.life=life;d.maxLife=life;d.amount=amount;d.color=color;d.isCrit=isCrit;d.offset=offset;damageNumbers.push(d);
}
const _enemySnapStack=[];let _enemySnapDepth=0;
function snapshotEnemies(){const depth=_enemySnapDepth++;let buf=_enemySnapStack[depth];if(!buf){buf=[];_enemySnapStack[depth]=buf;}else buf.length=0;for(let i=0;i<enemies.length;i++)buf.push(enemies[i]);for(let i=0;i<bosses.length;i++)buf.push(bosses[i]);return buf;}
function releaseEnemiesSnapshot(){_enemySnapDepth--;}
function forEachEnemySnapshot(fn){
  if(_enemySnapDepth>=8){console.warn('forEachEnemySnapshot depth limit');return;}
  const buf=snapshotEnemies();
  try{
    for(let i=0;i<buf.length;i++){
      const e=buf[i];
      if(e.removed)continue;
      if(fn(e)===false)break;
    }
  } finally {
    releaseEnemiesSnapshot();
  }
}
function removeEnemy(e){if(e.removed)return;e.removed=true;const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);}
function scheduleAction(owner,delayFrames,action){
  if(pendingActions.length>80)return;
  pendingActions.push({owner,framesLeft:delayFrames,action});
}
function updatePendingActions(){
  const snapshot=pendingActions.slice();
  pendingActions.length=0;
  for(const pa of snapshot){
    pa.framesLeft--;
    if(pa.framesLeft<=0){
      const o=pa.owner;
      const ownerAlive=!o||(o.alive!==false&&!o.removed);
      if(state==='playing'&&ownerAlive){
        try{ pa.action(); }catch(err){ console.error(err); }
      }
    } else {
      pendingActions.push(pa);
    }
  }
}

function getShopLayout(){

    const baseY=(n===1)?170:(150+p*(cardH+gapY));
    for(let i=0;i<3;i++){
      positions.push({pi:p,ai:i,x:startX+i*(cardW+gapX),y:baseY,w:cardW,h:cardH});
    }
  }
  return positions;
}

function drawShopCard(player,key,pos,bought){
  const art=ARTIFACTS[key];
  const stack=player.getArtifactStack(key);
  const max=art.maxStack;
  const isMax=stack>=max;
  const price=getArtifactPriceFor(player,key);
  const canAfford=player.coins>=price&&!bought&&!isMax;
  const hov=isHover(pos.x,pos.y,pos.w,pos.h)&&!bought&&!isMax;
  ctx.fillStyle=hov?'#2a2a4a':'#1a1a2e';ctx.fillRect(pos.x,pos.y,pos.w,pos.h);
  ctx.strokeStyle=isMax||bought?'#444':art.color;ctx.lineWidth=hov?4:2;
  ctx.strokeRect(pos.x,pos.y,pos.w,pos.h);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=isMax?'#555':art.color;ctx.font='bold 52px monospace';
  ctx.fillText(art.icon,pos.x+pos.w/2,pos.y+52);
  ctx.textBaseline='alphabetic';
  ctx.fillStyle=isMax?'#666':'#eee';ctx.font='bold 17px monospace';
  ctx.fillText(art.name,pos.x+pos.w/2,pos.y+110);
  ctx.fillStyle='#bbb';ctx.font='12px monospace';
  ctx.fillText(art.desc,pos.x+pos.w/2,pos.y+135);
  ctx.fillStyle=art.color;ctx.font='bold 13px monospace';
  ctx.fillText(`У вас: ×${stack}/${max}`,pos.x+pos.w/2,pos.y+162);
  ctx.fillStyle=art.color;ctx.font='bold 11px monospace';
  ctx.fillText(art.stackLabel(stack+1),pos.x+pos.w/2,pos.y+180);
  if(isMax){
    ctx.fillStyle='#4caf50';ctx.font='bold 16px monospace';
    ctx.fillText('★ МАКСИМУМ',pos.x+pos.w/2,pos.y+228);
  } else if(bought){
    ctx.fillStyle='#4caf50';ctx.font='bold 16px monospace';
    ctx.fillText('✓ КУПЛЕНО',pos.x+pos.w/2,pos.y+228);
  } else {
    const btnW=pos.w-50,btnH=46,bX=pos.x+25,bY=pos.y+205;
    ctx.fillStyle=canAfford?(hov?'#2a4a5f':'#1e3a5f'):'#1e1e36';
    ctx.fillRect(bX,bY,btnW,btnH);
    ctx.strokeStyle=canAfford?'#ffd700':'#555';ctx.lineWidth=2;
    ctx.strokeRect(bX,bY,btnW,btnH);
    ctx.fillStyle=canAfford?'#ffd700':'#888';ctx.font='bold 17px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(`💰 ${price}  КУПИТЬ`,bX+btnW/2,bY+btnH/2+1);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
  }
  ctx.textAlign='left';
}

function drawShop(){
  ctx.fillStyle='#0f0f18';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd700';ctx.font='bold 44px monospace';
  ctx.fillText('🛒 МАГАЗИН АРТЕФАКТОВ',W/2,60);
  ctx.fillStyle='#aaa';ctx.font='bold 14px monospace';
  ctx.fillText('Цена растёт ×1.5 за каждую копию, что у вас уже есть',W/2,88);

  const humans=players.filter(p=>!p.isAI);
  const n=humans.length;

  // Заголовок «до босса»
  const wavesToBoss=(wave%BOSS_EVERY===0)?0:BOSS_EVERY-(wave%BOSS_EVERY);
  ctx.fillStyle='#c084fc';ctx.font='bold 13px monospace';
  ctx.fillText(wavesToBoss===0?'★ СЕЙЧАС БОСС ★':`до босса: ${wavesToBoss}`,W/2,112);

  if(!shopState){ctx.textAlign='left';return;}
  const layout=getShopLayout();

  if(n>1){
    for(let p=0;p<n;p++){
      const y=150+p*(280+90)-30;
      ctx.fillStyle=humans[p].color;ctx.font='bold 20px monospace';
      ctx.textAlign='center';
      ctx.fillText(`ИГРОК ${humans[p].id+1} — ${humans[p].character.name}  💰${humans[p].coins}`,W/2,y);
    }
  } else {
    ctx.fillStyle='#ffd700';ctx.font='bold 22px monospace';
    ctx.textAlign='center';
    ctx.fillText(`💰 ${humans[0].coins}`,W/2,138);
  }

  const emptyRows={};
  for(const pos of layout){
    const player=humans[pos.pi];
    const key=shopState.offers[pos.pi][pos.ai];
    if(!key){
      emptyRows[pos.pi]=true;
      continue;
    }
    drawShopCard(player,key,pos,shopState.bought[pos.pi][pos.ai]);
  }
  // Сообщение для полностью прокачанных
  for(let p=0;p<n;p++){
    if(shopState.offers[p].length===0){
      const y=150+p*(280+90)+140;
      ctx.fillStyle='#666';ctx.font='bold 18px monospace';
      ctx.textAlign='center';
      ctx.fillText('Все артефакты максимально прокачаны!',W/2,y);
    }
  }

  const bw=360,bh=55,bx=W/2-bw/2,by=H-bh-20;
  drawButton(bx,by,bw,bh,'ДАЛЬШЕ →','#4caf50',isHover(bx,by,bw,bh));
  ctx.textAlign='left';
}

function updateShop(){
  if(!mouse.clicked||!shopState)return;
  const humans=players.filter(p=>!p.isAI);
  const bw=360,bh=55,bx=W/2-bw/2,by=H-bh-20;
  if(isHover(bx,by,bw,bh)){
    shopState=null;
    if(wave%10===0){beginAutoUpgradeSelection();}
    else{nextWave();state='playing';}
    return;
  }
  const layout=getShopLayout();
  for(const pos of layout){
    if(!isHover(pos.x,pos.y,pos.w,pos.h))continue;
    if(shopState.bought[pos.pi][pos.ai])continue;
    const player=humans[pos.pi];
    const key=shopState.offers[pos.pi][pos.ai];
    if(!key)continue;
    const stack=player.getArtifactStack(key);
    if(stack>=ARTIFACTS[key].maxStack)continue;
    const price=getArtifactPriceFor(player,key);
    if(player.coins>=price){
      player.coins-=price;
      player.equipArtifact(key);
      shopState.bought[pos.pi][pos.ai]=true;
      sfxCoin();
    }
    return;
  }
}

function getPlayerTactics(){
  const t = {avgAggression:0.5,avgRange:200,topAbility:-1,isKiter:false,isBrawler:false,isCamper:false,campCorner:-1,sampleCount:0};
  if(!players.length)return t;
  let aggSum=0,rangeSum=0,rangeN=0;
  const abil=[0,0,0,0,0], corner=[0,0,0,0];
  let kiter=0,brawler=0,camper=0,valid=0;
  for(const p of players){
    if(!p.alive||!p.aiProfile)continue;
    const pr=p.aiProfile;
    if(pr.distSamples<30)continue;
    valid++;
    const tot=pr.aggressiveFrames+pr.retreatFrames;
    if(tot>0)aggSum+=pr.aggressiveFrames/tot;
    if(pr.distSamples>0){rangeSum+=pr.avgEnemyDist;rangeN++;}
    for(let i=0;i<5;i++)abil[i]+=pr.abilityUses[i];
    for(let i=0;i<4;i++)corner[i]+=pr.cornerCount[i];
    if(pr.retreatFrames>pr.totalFrames*0.25)kiter++;
    if(pr.aggressiveFrames>pr.totalFrames*0.4)brawler++;
    if(pr.stillFrames>pr.totalFrames*0.35)camper++;
  }
  if(valid===0)return t;
  t.sampleCount=valid;
  t.avgAggression=aggSum/valid;
  t.avgRange=rangeN>0?rangeSum/rangeN:200;
  t.isKiter=kiter>valid/2;
  t.isBrawler=brawler>valid/2;
  t.isCamper=camper>valid/2;
  let maxUse=0;
  for(let i=0;i<5;i++)if(abil[i]>maxUse){maxUse=abil[i];t.topAbility=i;}
  const cTot=corner.reduce((a,b)=>a+b,0);
  if(cTot>100){
    let mx=0,idx=-1;
    for(let i=0;i<4;i++)if(corner[i]>mx){mx=corner[i];idx=i;}
    if(mx/cTot>0.4)t.campCorner=idx;
  }
  return t;
}
function getEnemyAIParams(enemy,tgt,tactics){
  const tier=enemyTier;
  const isRanged = enemy.type==='ranger' || (enemy.specialType&&['soundArcher','kunaiMaster','puppetMaster'].includes(enemy.specialType));
  const ai = {tier,predict:0,prefDist:null,retreat:false,strafe:0,focusWeak:false,isRanged};
  if(tier===0)return ai;
  ai.predict = [0,6,12,18,24][tier];
  // ═══ В обороне — только предсказание стрельбы, БЕЗ управления дистанцией ═══
  if(phase==='defense'){
    ai.prefDist=null; ai.retreat=false; ai.strafe=0;
    return ai;
  }
  if(tier>=2 && tactics && tactics.sampleCount>0){
    if(isRanged){
      if(tactics.isBrawler)ai.prefDist=340;
      else if(tactics.isKiter)ai.prefDist=220;
      else ai.prefDist=280;
    }
    // Милишники prefDist НЕ используют — они всегда должны дойти до контакта.
    // Иначе они превращаются в "неподвижные турели" на 110-170px и не бьют.
  }
  if(tier>=3 && enemy.hp/enemy.maxHp<0.25 && !enemy.isBoss)ai.retreat=true;
  if(tier>=3 && !isRanged)ai.strafe=0.35;
  if(tier>=3 && isRanged)ai.focusWeak=true;
if(tier>=4 && tactics && tactics.topAbility>=0 && isRanged){
    if(tactics.topAbility===0)ai.prefDist=Math.max(ai.prefDist||0,180);
    else if(tactics.topAbility===2)ai.prefDist=Math.max(ai.prefDist||0,250);
    else if(tactics.topAbility===3)ai.retreat=true;
	else if(tactics.topAbility===1)ai.prefDist=Math.max(ai.prefDist||0,220);
  }
  return ai;
}

  updateProfile(){

    pr.vx=dx;pr.vy=dy;
    pr.lastX=this.x;pr.lastY=this.y;
    const moved=Math.hypot(dx,dy);
    if(moved<0.5)pr.stillFrames++;
    let nearest=null,nd=Infinity;
    for(const e of enemies){if(e.removed)continue;const d=dist2(this,e);if(d<nd){nd=d;nearest=e;}}
    for(const b of bosses){if(b.removed)continue;const d=dist2(this,b);if(d<nd){nd=d;nearest=b;}}
    if(nearest){
      const d=Math.sqrt(nd);
      pr.avgEnemyDist=(pr.avgEnemyDist*pr.distSamples+d)/(pr.distSamples+1);
      pr.distSamples++;
      if(moved>0.5){
        const dot=dx*(nearest.x-this.x)+dy*(nearest.y-this.y);
        if(dot>0)pr.aggressiveFrames++; else pr.retreatFrames++;
      }
    }
    const cx=this.x-ARENA.x, cy=this.y-ARENA.y, m=250;
    if(cx<m&&cy<m)pr.cornerCount[0]++;

        forEachEnemySnapshot(o=>{if(o!==e&&!o.removed&&Math.hypot(o.x-e.x,o.y-e.y)<r)o.takeDamage(aoeDmg,this.x,this.y,false,this);});
        spawnShockwave(e.x,e.y,r,'#f97316');
      }
      if(au.knockback>0&&!e.isBoss){const dx=e.x-this.x,dy=e.y-this.y;const d=Math.hypot(dx,dy)||1;e.kx+=dx/d*au.knockback*3;e.ky+=dy/d*au.knockback*3;}

    }
    e.takeDamage(dmg,this.x,this.y,false,this);

  // FIX #2: tryDash сбрасывает таймер
    tryDash(dx,dy){
    if(this.dashCharges<=0||this.dashTimer>0)return;
    if(this.heavenlyTimer>0||this.eatTimer>0||this.sandWaveTimer>0||this.rollingTimer>0||this.sakuraHealingActive)return;
    if(this.susanooTimer>0)return;
    let ang;
    if(dx||dy)ang=Math.atan2(dy,dx);
    else ang=this.facing;
    this.dashCharges--;
    this.dashRechargeTimer=0;
    const isDashBurst=this.hook&&this.hook.type==='dashBurst';
    this.dashTimer=isDashBurst?12:10;
    const dashSpeed=this.getEffectiveSpeed()*(isDashBurst?5.5:4);
    this.dashVX=Math.cos(ang)*dashSpeed;
    this.dashVY=Math.sin(ang)*dashSpeed;
    this.facing=ang;
    this.invuln=Math.max(this.invuln,8);
    // ═══ Нэдзи: Импульс Хакке — AoE-взрыв + снос снарядов ═══
    if(isDashBurst){
      const burstR=100;
      const burstDmg=this.getDamage()*3;
      forEachEnemySnapshot(e=>{
        if(e.removed)return;
        if(Math.hypot(e.x-this.x,e.y-this.y)<burstR+e.r){
          e.takeDamage(burstDmg,this.x,this.y,false,this);
          if(!e.removed&&!e.isBoss){
            const dx2=e.x-this.x,dy2=e.y-this.y,d2=Math.hypot(dx2,dy2)||1;
            e.kx+=dx2/d2*30;e.ky+=dy2/d2*30;
            e.stunTimer=Math.max(e.stunTimer,30);
          }
        }
      });
      for(let i=enemyProjectiles.length-1;i>=0;i--){
        const ep=enemyProjectiles[i];
        if(Math.hypot(ep.x-this.x,ep.y-this.y)<burstR+ep.r){
          spawnParticles(ep.x,ep.y,'#a78bfa',4);
          enemyProjectiles.splice(i,1);
        }
      }
      spawnShockwave(this.x,this.y,burstR,'#a78bfa');
      spawnShockwave(this.x,this.y,burstR*1.3,'#c4b5fd');
      spawnParticles(this.x,this.y,'#a78bfa',30);
      sfx(600,0.15,0.10,'triangle',1.8);
    }
    spawnShockwave(this.x,this.y,45,'#a5f3fc');
    spawnParticles(this.x,this.y,'#a5f3fc',14);
    addTrail(this.x,this.y,'#67e8f9',this.r*0.8);
    screenShake=Math.max(screenShake,4);sfx(800,0.05,0.06,'sine',2);
    // ═══ Хината: −2с к КД умений после рывка (кроме SP и F) ═══
    if(this.hook&&this.hook.type==='dashCdReduce'){
      let reduced=0;
      for(let i=0;i<3;i++){
        if(this.cooldowns[i]>0){
          this.cooldowns[i]=Math.max(0,this.cooldowns[i]-120);
          reduced++;
        }
      }
      if(reduced>0){
        spawnDamageNumber(this.x,this.y-50,'−2с КД','#b8a0d4',true);
        spawnShockwave(this.x,this.y,60,'#b8a0d4');
      }
    }
  }

// ==================== ENEMY PROJECTILE ====================
class ChibakuBall{
  constructor(x,y,owner){
    this.x=x;this.y=y;this.owner=owner;
    this.r=25;this.dead=false;
    this.phase='fly';this.flyTimer=25;this.pullTimer=120;this.explodeTimer=30;
    this.vx=0;this.vy=0;
    this.pullRadius=450;
    this.damage=owner.getDamage();
    this.exploded=false;
  }
  update(){
    if(this.dead)return false;
    if(this.phase==='fly'){
      this.x+=this.vx;this.y+=this.vy;
      this.vx*=0.93;this.vy*=0.93;
      this.x=clamp(this.x,ARENA.x+40,ARENA.x+ARENA.w-40);
      this.y=clamp(this.y,ARENA.y+40,ARENA.y+ARENA.h-40);
      this.flyTimer--;
      if(this.flyTimer<=0)this.phase='pull';
    } else if(this.phase==='pull'){
      this.pullTimer--;
      for(const e of enemies){
        if(e.removed)continue;
        const dx=this.x-e.x,dy=this.y-e.y,d=Math.hypot(dx,dy)||1;
        if(d<this.pullRadius){
          const pull=14*(1-d/this.pullRadius);
          e.x+=dx/d*pull;e.y+=dy/d*pull;
        }
      }
      for(const b of bosses){
        if(b.removed)continue;
        const dx=this.x-b.x,dy=this.y-b.y,d=Math.hypot(dx,dy)||1;
        if(d<this.pullRadius){
          const pull=7*(1-d/this.pullRadius);
          b.x+=dx/d*pull;b.y+=dy/d*pull;
        }
      }
      if(this.pullTimer<=0)this.phase='explode';
    } else if(this.phase==='explode'){
      this.explodeTimer--;
      if(!this.exploded&&this.explodeTimer===25){
        this.exploded=true;
        for(const e of [...enemies]){
          if(e.removed)continue;
          const d=Math.hypot(e.x-this.x,e.y-this.y);
          if(d<200){
            e.takeDamage(this.damage*5,this.x,this.y,false,this.owner);
            if(!e.removed&&!e.isBoss){
              const dx=e.x-this.x,dy=e.y-this.y,dd=Math.hypot(dx,dy)||1;
              e.kx+=dx/dd*30;e.ky+=dy/dd*30;e.stunTimer=Math.max(e.stunTimer,60);
            }
          }
        }
        for(const b of [...bosses]){
          if(b.removed)continue;
          if(Math.hypot(b.x-this.x,b.y-this.y)<220)b.takeDamage(this.damage*4,this.x,this.y,false,this.owner);
        }
        spawnShockwave(this.x,this.y,250,'#1e1b4b');
        spawnShockwave(this.x,this.y,180,'#a855f7');
        spawnShockwave(this.x,this.y,120,'#fff');
        spawnParticles(this.x,this.y,'#1e1b4b',80);
        spawnParticles(this.x,this.y,'#a855f7',40);
        screenFlash=30;screenShake=20;hitStop=8;
      }
      if(this.explodeTimer<=0){this.dead=true;return false;}
    }
    return true;
  }
  draw(){
    if(this.dead)return;
    const t=tickMs/200;
    if(this.phase==='pull'){
      ctx.globalAlpha=0.1+0.08*Math.sin(t*2);
      ctx.fillStyle='#7c3aed';
      ctx.beginPath();ctx.arc(this.x,this.y,this.pullRadius,0,Math.PI*2);ctx.fill();
      for(let i=0;i<12;i++){
        const a=t*1.5+i*Math.PI/6;
        const prog=((tickMs/30+i*90)%120)/120;
        const dist=this.pullRadius*(1-prog*0.8);
        ctx.globalAlpha=0.7*prog;
        ctx.fillStyle='#c4b5fd';
        ctx.beginPath();ctx.arc(this.x+Math.cos(a)*dist,this.y+Math.sin(a)*dist,3,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.globalAlpha=0.7;
    for(let i=0;i<3;i++){
      const r=this.r+i*12+Math.sin(t+i)*4;
      ctx.strokeStyle=i===0?'#a855f7':'#4c1d95';
      ctx.lineWidth=3-i;
      ctx.beginPath();ctx.arc(this.x,this.y,r,t+i*2,t+i*2+Math.PI*1.5);ctx.stroke();
    }
    ctx.globalAlpha=1;
    const grd=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r);
    grd.addColorStop(0,'#000');
    grd.addColorStop(0.7,'#1e1b4b');
    grd.addColorStop(1,'#7c3aed');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
  }
}
class EnemyProjectile{
  constructor(x,y,ang,dmg,r,speed,homing,owner=null){this.x=x;this.y=y;this.vx=Math.cos(ang)*speed;this.vy=Math.sin(ang)*speed;this.r=r;this.damage=dmg;this.homing=homing;this.life=200;this.dead=false;this.owner=owner;}
  update(){
    if(this.homing){let best=null,bd=Infinity;for(const p of players){if(!p.alive||p.sakuraJumpActive)continue;const d=dist2(this,p);if(d<bd){bd=d;best=p;}}if(best){const ta=Math.atan2(best.y-this.y,best.x-this.x);const ca=Math.atan2(this.vy,this.vx);const na=ca+clamp(angleDiff(ta,ca),-0.05,0.05);const spd=Math.hypot(this.vx,this.vy);this.vx=Math.cos(na)*spd;this.vy=Math.sin(na)*spd;}}
    this.x+=this.vx;this.y+=this.vy;this.life--;
    addTrail(this.x,this.y,this.homing?'#f43f5e':'#f59e0b',this.r*0.8);
    if(this.life<=0||this.x<ARENA.x-20||this.x>ARENA.x+ARENA.w+20||this.y<ARENA.y-20||this.y>ARENA.y+ARENA.h+20){this.dead=true;return;}
        for(const p of players){
          if(!p.alive||p.vanishedTimer>0||p.sakuraJumpActive)continue;
          if(p.flyingBugActive && !(this.owner && this.owner.isBoss)) continue;
          const dx=p.x-this.x,dy=p.y-this.y;
          if(dx*dx+dy*dy<(p.r+this.r)**2){p.takeDamage(this.damage,this.owner);this.dead=true;break;}
        }
    for(const squad of anbuSquads){for(const a of squad.members){if(!a.alive)continue;const dx=a.x-this.x,dy=a.y-this.y;if(dx*dx+dy*dy<(a.r+this.r)**2){a.takeDamage(this.damage);this.dead=true;break;}}}
  }
  draw(){
    if(this.damage===0){ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(this.x,this.y-8);ctx.lineTo(this.x,this.y+8);ctx.stroke();return;}
    if(this.homing){ctx.globalAlpha=0.4;ctx.fillStyle='#f43f5e';ctx.beginPath();ctx.arc(this.x,this.y,this.r*1.8,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
    ctx.fillStyle=this.homing?'#f43f5e':'#f59e0b';
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  }
}

// ==================== BUG SWARM ====================
class BugSwarm{
  constructor(x,y,owner){this.x=x;this.y=y;this.owner=owner;this.hp=50;this.maxHp=50;this.r=12;this.dead=false;this.life=600;this.attackCd=0;this.target=null;this.hurtFlash=0;this.type='bugswarm';}
  update(){
    if(this.dead)return false;this.life--;if(this.life<=0){this.dead=true;return false;}
    if(this.hurtFlash>0)this.hurtFlash--;
    if(!this.target||this.target.removed)this.target=findNearestTarget(this,800);
    if(this.target){const dx=this.target.x-this.x,dy=this.target.y-this.y;const d=Math.hypot(dx,dy)||1;if(d>this.r+this.target.r){this.x+=dx/d*2.8;this.y+=dy/d*2.8;addTrail(this.x,this.y,'#84cc16',3);}else if(this.attackCd<=0){this.attackCd=30;this.target.takeDamage(this.hp,this.x,this.y,false,this.owner);spawnParticles(this.x,this.y,'#84cc16',8);this.hp-=10;if(this.hp<=0){this.dead=true;return false;}}}
    if(this.attackCd>0)this.attackCd--;
    return true;

class KusanagiSword{
  constructor(owner,offset){
    this.owner=owner;this.offset=offset;this.angle=offset;
    this.radius=85;this.x=owner.x;this.y=owner.y;
    this.hitCd={};this.dead=false;this.r=14;
  }
  update(){
    if(!this.owner.alive){this.dead=true;return false;}
    this.angle+=0.08;
    this.x=this.owner.x+Math.cos(this.angle)*this.radius;
    this.y=this.owner.y+Math.sin(this.angle)*this.radius;
    const damage=this.owner.getDamage()*1.5;
    forEachEnemySnapshot(e=>{
      if(e.removed)return;
      if(this.hitCd[e]&&this.hitCd[e]>tickMs)return;
      if(Math.hypot(e.x-this.x,e.y-this.y)<this.r+e.r){
        e.takeDamage(damage,this.x,this.y,false,this.owner);
        this.hitCd[e]=tickMs+400;
        spawnParticles(this.x,this.y,'#e2e8f0',4);
      }
    });
    return true;
  }
  draw(){
    ctx.globalAlpha=0.85;

    ctx.shadowColor='#e2e8f0';ctx.shadowBlur=12;
    ctx.fillStyle='#e2e8f0';
    ctx.beginPath();
    ctx.moveTo(0,-this.r*1.3);
    ctx.lineTo(this.r*0.3,this.r*0.6);
    ctx.lineTo(0,this.r);
    ctx.lineTo(-this.r*0.3,this.r*0.6);
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }
}	
class Projectile{
  constructor(x,y,ang,dmg,col,r=4,speed=8,pierce=false){
    this.x=x;this.y=y;this.vx=Math.cos(ang)*speed;this.vy=Math.sin(ang)*speed;
    this.r=r;this.damage=dmg;this.color=col;this.life=120;this.dead=false;this.pierce=pierce;
    this.hitSet=new Set();this.bounces=0;
    this.appliesCurse=false;this.curseDuration=999999;
    this.appliesParasite=false;this.spreadsOnDeath=0;
    this.appliesWeakPoint=false;this.appliesBleed=false;this.appliesSeal=false;this.appliesShadowWeb=false;
    this.appliesChakraBlock=false;this.appliesStun=0;this.appliesSlow=0;
    this.pushes=0;this.explodeRadius=0;
    this.trailTimer=0;this.fromAutoAttack=false;
    this.boomerang=0;this.ownerRef=null;this.attacker=null;
    this.appliesPoison=false;this.poisonDmg=0;this.isRasenshuriken=false;
    this.isBoomerang=false;this.returning=false;this.sourceAbilityIndex=-1;
    this.isPoisonKamikaze=false;this.isSusanooArrow=false;this.dragsEnemies=false;
    this.spawnVortexOnEnd=false;this.pierceCount=0;
    this.isTentenBoomerang=false;this.isTentenSword=false;
      this.mindControlOnHit=false;this.hasStopped=false;this.stopTimer=0;
        this.stunOnHit=0;this.isFumaShuriken=false;
this.homing=false;this.homingRange=400;this.homingTarget=null;
    this.appliesShinoMark=false;
    this.isShikamaruNeedle=false;
  }
  update(){
    // ═══ Самонаведение ═══
    if(this.homing){
      if(!this.homingTarget||this.homingTarget.removed){
        if(this.isShikamaruNeedle && this.attacker){
          this.homingTarget = findNearestUnlinkedTarget(this, this.homingRange, this.attacker);
        } else {
          this.homingTarget = findNearestTarget(this, this.homingRange);
        }
      }
      if(this.homingTarget){
        const ta=Math.atan2(this.homingTarget.y-this.y,this.homingTarget.x-this.x);
        const ca=Math.atan2(this.vy,this.vx);
        const na=ca+clamp(angleDiff(ta,ca),-0.09,0.09);
        const spd=Math.hypot(this.vx,this.vy);
        this.vx=Math.cos(na)*spd;
        this.vy=Math.sin(na)*spd;
      }
    }
    if(this.isTentenBoomerang&&this.attacker){
      if(!this.hasStopped){
        this.boomerang--;
        if(this.boomerang<=0){this.hasStopped=true;this.stopTimer=60;this.vx=0;this.vy=0;}
      } else if(this.stopTimer>0){
        this.stopTimer--;this.vx=0;this.vy=0;
        if(this.stopTimer===0)this.hitSet.clear();
      } else {
        if(!this.attacker||!this.attacker.alive){this.dead=true;return;}
        const ang=Math.atan2(this.attacker.y-this.y,this.attacker.x-this.x);
        this.vx=Math.cos(ang)*14;this.vy=Math.sin(ang)*14;
        if(Math.hypot(this.attacker.x-this.x,this.attacker.y-this.y)<this.attacker.r+this.r){this.dead=true;return;}
      }
    }
    const prevX=this.x,prevY=this.y;
    this.x+=this.vx;this.y+=this.vy;this.life--;
    this.trailTimer++;
    if(this.trailTimer%2===0)addTrail(this.x,this.y,this.color,this.r*0.6);
    if(this.life<=0){
      if(this.spawnVortexOnEnd){
        addZone(new Zone(this.x,this.y,160,180,this.damage*0.25,'#a5f3fc',this.attacker,'vortex'));
        spawnShockwave(this.x,this.y,160,'#a5f3fc');spawnParticles(this.x,this.y,'#a5f3fc',40);
      }
      this.dead=true;return;
    }
    if(this.x<ARENA.x-100||this.x>ARENA.x+ARENA.w+100||this.y<ARENA.y-100||this.y>ARENA.y+ARENA.h+100){
      if(this.spawnVortexOnEnd){
        addZone(new Zone(clamp(this.x,ARENA.x+160,ARENA.x+ARENA.w-160),clamp(this.y,ARENA.y+160,ARENA.y+ARENA.h-160),160,180,this.damage*0.25,'#a5f3fc',this.attacker,'vortex'));
      }
      this.dead=true;return;
    }
    const self=this;
    forEachEnemySnapshot(e=>{
      if(e.removed||self.hitSet.has(e))return;
      const d=pointSegmentDist(e.x,e.y,prevX,prevY,self.x,self.y);
      if(d<e.r+self.r){
        let dmg=self.damage;
        if(self.attacker&&self.attacker.hook&&self.attacker.hook.type==='weakPoint'&&e.weakPointTimer>0)dmg*=1.6;
        e.takeDamage(dmg,self.x,self.y,false,self.attacker);
		        if(self.isKonanPaper && self.attacker && typeof self.attacker.hp==='number'){

        }
        if(self.dragsEnemies&&!e.removed&&!e.isBoss){
          const arrowAng=Math.atan2(self.vy,self.vx);
          const arrowSpd=Math.hypot(self.vx,self.vy);
          e.kx=Math.cos(arrowAng)*arrowSpd;e.ky=Math.sin(arrowAng)*arrowSpd;
        }
        if(!e.removed){
          if(self.appliesShinoMark){e.bugMarkTimer=300;}
          if(self.appliesCurse){e.curseTimer=999999;e.curseMarks=Math.min(3,(e.curseMarks||0)+1);}
          if(self.appliesParasite){e.parasiteTimer=300;e.parasiteDamage=self.damage*0.5;e.parasiteSpreads=self.spreadsOnDeath;e.parasiteStacks=Math.min(5,(e.parasiteStacks||0)+1);}
          if(self.appliesWeakPoint){e.weakPointTimer=180;}
          if(self.appliesBleed){e.bleedTimer=Math.max(e.bleedTimer,180);e.bleedDamage=self.damage*0.7;}
          if(self.appliesSeal){e.sealStacks=Math.min(8,(e.sealStacks||0)+1);if(self.attacker)self.attacker.triggerSeal(e);}
          if(self.appliesShadowWeb){e.shadowWebTimer=300;e.shadowWebOwner=self.attacker;}
          if(self.appliesChakraBlock)e.chakraBlockStacks=Math.min(10,(e.chakraBlockStacks||0)+1);
          if(self.appliesSlow>0)e.slowTimer=Math.max(e.slowTimer,self.appliesSlow);
          if(self.stunOnHit>0&&!e.isBoss)e.stunTimer=Math.max(e.stunTimer,self.stunOnHit);
          if(self.pushes>0){if(self.attacker&&self.attacker.hook&&self.attacker.hook.type==='gust')self.attacker.fanKill=true;if(!e.isBoss){const ang=Math.atan2(e.y-prevY,e.x-prevX);e.kx+=Math.cos(ang)*self.pushes;e.ky+=Math.sin(ang)*self.pushes;}}
          if(self.appliesPoison&&self.poisonDmg>0){e.burnTimer=Math.max(e.burnTimer,180);e.burnDamage=Math.max(e.burnDamage,self.poisonDmg);}
          if(self.mindControlOnHit&&!e.isBoss&&!e.specialType){e.mindControlTimer=Math.max(e.mindControlTimer,420);e.mindControlOwner=self.attacker;e.mcDamageMult=2;}
          if(self.attacker&&self.attacker.hook&&self.attacker.hook.type==='punchCharge'&&self.fromAutoAttack)self.attacker.hookValue=Math.min(3,self.attacker.hookValue+0.3);
          if(self.isShikamaruNeedle&&self.attacker){
            e.shadowWebTimer=Math.max(e.shadowWebTimer||0,300);
            e.shadowWebOwner=self.attacker;
          }
        }
        if(self.isPoisonKamikaze){
          spawnShockwave(self.x,self.y,140,'#7c2d12');spawnParticles(self.x,self.y,'#84cc16',30);
          const att=self.attacker;
          forEachEnemySnapshot(o=>{
            if(Math.hypot(o.x-self.x,o.y-self.y)<140){
              o.takeDamage(self.damage*0.6,self.x,self.y,false,att);
              if(!o.removed){o.burnTimer=Math.max(o.burnTimer,300);o.burnDamage=Math.max(o.burnDamage,self.damage*0.3);}
            }
          });
          addZone(new Zone(self.x,self.y,120,300,att.getDamage()*1.2,'#84cc16',att,'damage'));
          self.dead=true;return;
        }
        if(self.explodeRadius>0&&!self.isBoomerang){
          spawnShockwave(self.x,self.y,self.explodeRadius,'#f97316');
          const att=self.attacker;
          forEachEnemySnapshot(o=>{if(o!==e&&Math.hypot(o.x-self.x,o.y-self.y)<self.explodeRadius)o.takeDamage(self.damage*0.6,self.x,self.y,false,att);});
        }
        spawnParticles(self.x,self.y,self.color,12);
        for(let _i=0;_i<3;_i++){const _a=Math.random()*Math.PI*2,_s=rand(3,7);emitParticle(self.x,self.y,Math.cos(_a)*_s,Math.sin(_a)*_s,16,'#fff',3);}
        addTrail(self.x,self.y,'#fff',self.r*1.4);
        if(self.isTentenBoomerang){
          self.hitSet.add(e);
        } else if(self.bounces>0){
          self.hitSet.add(e);
          self.bounces--;
          let next=null,bd=Infinity;
          const checkTgt=(t)=>{if(t.removed||self.hitSet.has(t))return;const d2=(t.x-self.x)**2+(t.y-self.y)**2;if(d2<bd){bd=d2;next=t;}};
          for(const en of enemies)checkTgt(en);
          for(const b of bosses)checkTgt(b);
          if(next){
            const ang=Math.atan2(next.y-self.y,next.x-self.x);
            const spd=Math.hypot(self.vx,self.vy);
            self.vx=Math.cos(ang)*spd;self.vy=Math.sin(ang)*spd;
            self.life=Math.max(self.life,60);
          } else {self.dead=true;return false;}
        } else if(self.pierceCount>0){
          self.pierceCount--;self.hitSet.add(e);
          if(self.pierceCount<=0){self.dead=true;return false;}
        } else if(self.pierce){
          self.hitSet.add(e);
        } else {self.dead=true;return false;}
      }
    });
  }
  draw(){
  if(this.isShikamaruNeedle){
  const ang=Math.atan2(this.vy,this.vx);
  ctx.save();ctx.translate(this.x,this.y);ctx.rotate(ang);
  // Хвост-тень
  ctx.globalAlpha=0.35;

  ctx.lineTo(0,-this.r*0.6);

  // Тело: тонкий ромб (игла)
  ctx.globalAlpha=1;
  ctx.shadowColor='#8b5cf6';ctx.shadowBlur=10;
  ctx.fillStyle='#a5b4fc';
  ctx.beginPath();
  ctx.moveTo(this.r*2.2,0);           // остриё
  ctx.lineTo(0,-this.r*0.7);
  ctx.lineTo(-this.r*1.4,0);           // хвост
  ctx.lineTo(0,this.r*0.7);
  ctx.closePath();ctx.fill();
  // Блик
  ctx.shadowBlur=0;
  ctx.strokeStyle='#e0e7ff';ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(this.r*1.5,0);
  ctx.lineTo(0,-this.r*0.35);
  ctx.stroke();
  ctx.restore();
  return;
}
    if(this.isFumaShuriken){
      const rot=tickMs/50;
      ctx.save();ctx.translate(this.x,this.y);ctx.rotate(rot);
      ctx.shadowColor='#a5f3fc';ctx.shadowBlur=10;

      for(let i=0;i<4;i++){
        const a=i*Math.PI/2;
        const outer=this.r*1.6,inner=this.r*0.55;
        ctx.lineTo(Math.cos(a)*outer,Math.sin(a)*outer);
        ctx.lineTo(Math.cos(a+Math.PI/4)*inner,Math.sin(a+Math.PI/4)*inner);
      }
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(0,0,this.r*0.35,0,Math.PI*2);ctx.fill();
      ctx.restore();

    if(this.isTentenSword){
      const ang=Math.atan2(this.vy,this.vx);

      ctx.fillStyle='#e2e8f0';
      ctx.beginPath();ctx.moveTo(this.r*1.8,0);ctx.lineTo(-this.r*0.4,-this.r*0.6);ctx.lineTo(-this.r*0.4,this.r*0.6);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;

      ctx.globalAlpha=1;ctx.fillStyle='#a855f7';
      ctx.beginPath();ctx.moveTo(this.r*1.6,0);ctx.lineTo(-this.r*1.4,-this.r*0.5);ctx.lineTo(-this.r*0.6,0);ctx.lineTo(-this.r*1.4,this.r*0.5);ctx.closePath();ctx.fill();

      const rot=tickMs/60;const size=this.r*1.8;
      ctx.globalAlpha=0.4;ctx.fillStyle='#a5f3fc';ctx.beginPath();ctx.arc(this.x,this.y,size*1.6,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      ctx.save();ctx.translate(this.x,this.y);ctx.rotate(rot);
      ctx.fillStyle='#a5f3fc';
      for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-0.35)*size,Math.sin(a-0.35)*size);ctx.lineTo(Math.cos(a+0.35)*size*0.55,Math.sin(a+0.35)*size*0.55);ctx.closePath();ctx.fill();}

    }
    if(this.r>8){ctx.globalAlpha=0.4;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.r*1.6,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}

    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*0.4,0,Math.PI*2);ctx.fill();
  }
}

// ==================== CLONE / PET / BEAM / MINE / ZONE / SEAL / SWORD / TELEGRAPH / TORNADO / ANBU ====================
class Clone{
  constructor(x,y,owner,mode,aim){
    this.x=x;this.y=y;this.owner=owner;this.mode=mode;this.life=480;this.maxLife=480;this.r=12;
    this.shootTimer=0;this.aim=aim;this.color='#ffcc66';this.projectileColor=null;this.melee=false;this.meleeCd=0;
    this.isLivingPuppet=false;this.hp=0;this.maxHp=0;this.removed=false;
    if(mode==='shadow_clone'){this.color='#ff9900';this.projectileColor='#4fc3f7';this.r=13;}
    else if(mode==='rasengan_rusher'){this.color='#4fc3f7';this.r=13;this.exploded=false;}
    else if(mode==='ranged_clone'){this.color='#ffcc66';this.projectileColor='#4fc3f7';this.r=12;}
    else if(mode==='akamaru_clone'){this.color='#d4b483';this.r=12;}
    else if(mode==='bug_clone'){this.color='#84cc16';this.r=14;}
  }
  update(){
    this.life--;if(this.life<=0)return false;
    if(this.shootTimer>0)this.shootTimer--;
    if(this.meleeCd>0)this.meleeCd--;
    if(this.mode==='rasengan_rusher'){
      if(this.exploded)return false;
      const best=findNearestTarget(this,700);
      if(best){
        const dx=best.x-this.x,dy=best.y-this.y;const d=Math.hypot(dx,dy)||1;
        if(d>this.r+best.r){this.x+=dx/d*4.5;this.y+=dy/d*4.5;addTrail(this.x,this.y,'#4fc3f7',8);}
        this.x=clamp(this.x,ARENA.x+this.r,ARENA.x+ARENA.w-this.r);this.y=clamp(this.y,ARENA.y+this.r,ARENA.y+ARENA.h-this.r);
        if(!best.removed&&d<=this.r+best.r+4){
          this.exploded=true;
          const dmg=this.owner.getDamage()*7;
          spawnShockwave(this.x,this.y,180,'#4fc3f7');spawnParticles(this.x,this.y,'#4fc3f7',50);
          forEachEnemySnapshot(e=>{if(Math.hypot(e.x-this.x,e.y-this.y)<180){e.takeDamage(dmg,this.x,this.y,false,this.owner);if(!e.removed&&!e.isBoss){const ex=e.x-this.x,ey=e.y-this.y,ed=Math.hypot(ex,ey)||1;e.kx+=ex/ed*25;e.ky+=ey/ed*25;}}});
          screenShake=Math.max(screenShake,15);hitStop=Math.max(hitStop,5);sfxBoom();
          return false;
        }
      }
      return true;
    }
    if(this.mode==='ranged_clone'){
      const dx=this.owner.x-this.x,dy=this.owner.y-this.y;const d=Math.hypot(dx,dy)||1;
      if(d>180){this.x+=dx/d*2.5;this.y+=dy/d*2.5;}
      else if(d<90){this.x-=dx/d*1.5;this.y-=dy/d*1.5;}
      this.x=clamp(this.x,ARENA.x+this.r,ARENA.x+ARENA.w-this.r);this.y=clamp(this.y,ARENA.y+this.r,ARENA.y+ARENA.h-this.r);
      if(this.shootTimer===0){
        const best=findNearestTarget(this,600);
        if(best){
          const ang=Math.atan2(best.y-this.y,best.x-this.x);
          const proj=new Projectile(this.x,this.y,ang,this.owner.getDamage()*0.7,this.owner.color,6,12);
          proj.attacker=this.owner;projectiles.push(proj);
          this.shootTimer=50;
        }
      }
      return true;
    }
    if(this.mode==='akamaru_clone'&&this.melee){
      const best=findNearestTarget(this,500);
      if(best){const dx=best.x-this.x,dy=best.y-this.y;const d=Math.hypot(dx,dy)||1;
        if(d>this.r+best.r+4){this.x+=dx/d*3.4;this.y+=dy/d*3.4;}
        else if(this.meleeCd===0&&!best.removed){this.meleeCd=20;best.takeDamage(this.owner.getDamage()*1.2,this.x,this.y,false,this.owner);if(!best.removed){const dd=Math.hypot(dx,dy)||1;best.kx+=dx/dd*6;best.ky+=dy/dd*6;best.bleedTimer=Math.max(best.bleedTimer,180);best.bleedDamage=this.owner.getDamage()*0.5;}}
        this.x=clamp(this.x,ARENA.x+this.r,ARENA.x+ARENA.w-this.r);this.y=clamp(this.y,ARENA.y+this.r,ARENA.y+ARENA.h-this.r);
      }

    if(this.mode==='bug_clone'){

      }

    }
    if(this.isLivingPuppet){
      if(this.mode==='turret'){
        if(this.shootTimer===0){
          const best=findNearestTarget(this,500);
          if(best){const ang=Math.atan2(best.y-this.y,best.x-this.x);
            const proj=new Projectile(this.x,this.y,ang,this.owner.getDamage()*0.9,'#a16207',7,10);

          this.shootTimer=60;
        }

      }
    }

  }
  draw(){

      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Н',this.x,this.y);ctx.textBaseline='alphabetic';ctx.textAlign='left';
      return;

    if(this.mode==='ranged_clone'){
      ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Н',this.x,this.y);ctx.textBaseline='alphabetic';ctx.textAlign='left';

      ctx.fillStyle='#000';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('А',this.x,this.y);ctx.textBaseline='alphabetic';ctx.textAlign='left';
      ctx.globalAlpha=1;return;
    }
	    if(this.mode==='bug_clone'){
      const t=tickMs/80;
      // Крылья
      ctx.globalAlpha=0.4*Math.min(1,this.life/60);
      ctx.fillStyle='#a3e635';
      const wingA=Math.sin(t)*0.3;
      ctx.beginPath();ctx.ellipse(this.x-12,this.y-4,14,6,wingA,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(this.x+12,this.y-4,14,6,-wingA,0,Math.PI*2);ctx.fill();
      // Тело
      ctx.globalAlpha=Math.min(1,this.life/60);

      // HP-бар
      if(this.hp<this.maxHp&&this.hp>0){

      else if(this.mode==='trap_puppet'){ctx.fillStyle='#7c2d12';ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;const px=this.x+Math.cos(a)*this.r,py=this.y+Math.sin(a)*this.r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
      if(this.hp>0){const bw=24,bh=3;const bx=this.x-bw/2,by=this.y-this.r-8;ctx.fillStyle='#000';ctx.fillRect(bx-1,by-1,bw+2,bh+2);ctx.fillStyle='#e33';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#3e6';ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),bh);}

    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();

class Pet{
  constructor(x,y,owner,type){this.x=x;this.y=y;this.owner=owner;this.type=type;
    this.isPet=true;this.rageMode=false;this.rageTimer=0;this.jumpTarget=null;this.removed=false;
    if(type==='akamaru'){this.r=13;this.life=999999;this.hp=800;this.maxHp=800;}
    else if(type==='wolf'){this.r=14;this.life=600;}
    else if(type==='gama'){this.r=28;this.life=480;}
    else if(type==='puppet_beast'){this.r=20;this.life=360;}
    else{this.r=13;this.life=300;}
    this.maxLife=this.life;this.target=null;this.biteTimer=0;this.aoeTimer=0;this.bleedPower=0.5;this.hurtFlash=0;this.shootTimer=0;
  }
  getNearest(){return findNearestTarget(this,500);}
  takeDamage(d){
    if(this.type!=='akamaru')return;
    if(this.hp<=0)return;
    if(this.rageMode)return;
    this.hp-=d;this.hurtFlash=6;
    if(this.hp<=0){
      this.hp=0;
      if(this.owner&&this.owner.charId==='kiba'){
        this.owner.akamaruDeadCd=900;
        spawnDamageNumber(this.owner.x,this.owner.y-50,'АКАМАРУ ПОГИБ! (15с)','#f55',true);
      }
      spawnShockwave(this.x,this.y,80,'#8b6f47');
      spawnParticles(this.x,this.y,'#8b6f47',30);
    }
  }
  update(){
    if(this.life<=0)return false;
    if(this.hurtFlash>0)this.hurtFlash--;
    if(this.type==='akamaru'&&this.hp<=0)return false;
    if(this.type!=='akamaru')this.life--;
    if(!this.owner.alive)return false;
    if(this.type==='akamaru'){
      const distToOwner=Math.hypot(this.x-this.owner.x,this.y-this.owner.y);
      const regen=(distToOwner<150)?3/60:1/60;
      this.hp=Math.min(this.maxHp,this.hp+regen);
      if(this.rageMode){
        this.rageTimer--;
        if(this.rageTimer<=0){this.rageMode=false;this.r=13;this.jumpTarget=null;}
        if(!this.jumpTarget||this.jumpTarget.removed){
          let best=null,bd=Infinity;
          for(const e of enemies){if(e.removed)continue;const d2=dist2(this,e);if(d2<bd){bd=d2;best=e;}}
          for(const b of bosses){if(b.removed)continue;const d2=dist2(this,b);if(d2<bd){bd=d2;best=b;}}
          this.jumpTarget=best;
        }
        if(this.jumpTarget){
          const dx=this.jumpTarget.x-this.x,dy=this.jumpTarget.y-this.y;
          const d=Math.hypot(dx,dy)||1;
          if(d>this.r+this.jumpTarget.r){this.x+=dx/d*15;this.y+=dy/d*15;addTrail(this.x,this.y,'#dc2626',10);}
          else{
            const dmg=this.owner.getDamage()*1.8;
            this.jumpTarget.takeDamage(dmg,this.x,this.y,false,this);
            if(!this.jumpTarget.removed){this.jumpTarget.bleedTimer=Math.max(this.jumpTarget.bleedTimer,300);this.jumpTarget.bleedDamage=this.owner.getDamage()*1.5;}
            spawnShockwave(this.x,this.y,60,'#dc2626');
            this.jumpTarget=null;
          }
        }
        this.x=clamp(this.x,ARENA.x+this.r,ARENA.x+ARENA.w-this.r);
        this.y=clamp(this.y,ARENA.y+this.r,ARENA.y+ARENA.h-this.r);
        this.r=25+Math.sin(tickMs/80)*3;
        return true;
      }
      // Следование за владельцем
      const dx=this.owner.x-this.x,dy=this.owner.y-this.y;const d=Math.hypot(dx,dy)||1;
      if(d>70){this.x+=dx/d*2.7;this.y+=dy/d*2.7;}
      // Поиск цели (радиус увеличен для ranged)
      if(!this.target||this.target.removed)this.target=findNearestTarget(this,400);
      if(this.target){
        const dx2=this.target.x-this.x,dy2=this.target.y-this.y;
        const d2=Math.hypot(dx2,dy2)||1;
        // Держит дистанцию: слишком близко — отходит, слишком далеко — подходит
        if(d2<150){this.x-=dx2/d2*2;this.y-=dy2/d2*2;}
        else if(d2>260){this.x+=dx2/d2*1.5;this.y+=dy2/d2*1.5;}
        // СТРЕЛЬБА (вместо укуса)
        if(this.shootTimer>0)this.shootTimer--;
        if(this.shootTimer<=0&&d2<450){
          this.shootTimer=25;
          const ang=Math.atan2(dy2,dx2);
          const proj=new Projectile(this.x,this.y,ang,this.owner.getDamage()*0.6,'#d4b483',5,12);
          proj.attacker=this.owner;
          proj.fromAutoAttack=true;
          projectiles.push(proj);
        }
        this.x=clamp(this.x,ARENA.x+this.r,ARENA.x+ARENA.w-this.r);
        this.y=clamp(this.y,ARENA.y+this.r,ARENA.y+ARENA.h-this.r);
      }
      if(!this.rageMode){
        for(let i=0;i<enemies.length;i++){const e=enemies[i];if(Math.hypot(e.x-this.x,e.y-this.y)<this.r+e.r+2){this.takeDamage(e.getEffectiveDamage()*0.5);if(this.hp<=0)return false;}}
        for(let i=0;i<bosses.length;i++){const e=bosses[i];if(Math.hypot(e.x-this.x,e.y-this.y)<this.r+e.r+2){this.takeDamage(e.getEffectiveDamage()*0.5);if(this.hp<=0)return false;}}
      }
    } else if(this.type==='wolf'){
      if(!this.target||this.target.removed)this.target=this.getNearest();
      if(this.target){const dx=this.target.x-this.x,dy=this.target.y-this.y;const d=Math.hypot(dx,dy)||1;
        if(d>this.r+this.target.r){this.x+=dx/d*3;this.y+=dy/d*3;}
        this.biteTimer++;
        if(d<=this.r+this.target.r+5&&this.biteTimer>=35){this.biteTimer=0;this.target.takeDamage(this.owner.getDamage()*0.9,this.x,this.y,false,this.owner);}
      }
    } else if(this.type==='gama'){
      if(!this.target||this.target.removed)this.target=this.getNearest();
      if(this.target){const dx=this.target.x-this.x,dy=this.target.y-this.y;const d=Math.hypot(dx,dy)||1;if(d>120){this.x+=dx/d*1.6;this.y+=dy/d*1.6;}}
      this.aoeTimer++;
      if(this.aoeTimer>=60){this.aoeTimer=0;spawnShockwave(this.x,this.y,110,'#ff6600');forEachEnemySnapshot(e=>{if(Math.hypot(e.x-this.x,e.y-this.y)<110){e.takeDamage(this.owner.getDamage()*1.5,this.x,this.y,false,this.owner);}});}
    } else if(this.type==='puppet_beast'){
      if(!this.target||this.target.removed)this.target=this.getNearest();
      if(this.target){const dx=this.target.x-this.x,dy=this.target.y-this.y;const d=Math.hypot(dx,dy)||1;
        if(d>this.r+this.target.r){this.x+=dx/d*2.8;this.y+=dy/d*2.8;}
        this.biteTimer++;
        if(d<=this.r+this.target.r+8&&this.biteTimer>=20){this.biteTimer=0;this.target.takeDamage(this.owner.getDamage()*1.4,this.x,this.y,false,this.owner);if(!this.target.removed&&!this.target.isBoss){const dd=Math.hypot(dx,dy)||1;this.target.kx+=dx/dd*15;this.target.ky+=dy/dd*15;this.target.stunTimer=Math.max(this.target.stunTimer,30);}}
      }
    }
    return true;
  }
  draw(){
    const alpha=Math.min(1,this.life/60);ctx.globalAlpha=alpha;
    const fill=this.hurtFlash>0?'#fff':null;
    if(this.type==='akamaru'){
      const bodyColor=this.rageMode?(fill||'#dc2626'):(fill||'#e8d5b7');
      const outlineColor=this.rageMode?'#7f1d1d':'#8b6f47';
      if(this.rageMode){ctx.globalAlpha=0.4+0.2*Math.sin(tickMs/60);ctx.fillStyle='#dc2626';ctx.beginPath();ctx.arc(this.x,this.y,this.r+10,0,Math.PI*2);ctx.fill();ctx.globalAlpha=alpha;}
      ctx.fillStyle=bodyColor;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=outlineColor;ctx.lineWidth=this.rageMode?3:2;ctx.stroke();
      if(!fill){ctx.fillStyle=outlineColor;ctx.beginPath();ctx.moveTo(this.x-8,this.y-this.r+2);ctx.lineTo(this.x-4,this.y-this.r-6);ctx.lineTo(this.x-1,this.y-this.r+2);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(this.x+8,this.y-this.r+2);ctx.lineTo(this.x+4,this.y-this.r-6);ctx.lineTo(this.x+1,this.y-this.r+2);ctx.closePath();ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(this.x-4,this.y-1,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(this.x+4,this.y-1,2,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=alpha;
      if(this.hp<this.maxHp){const bw=24,bh=3;const bx=this.x-bw/2,by=this.y-this.r-6;ctx.fillStyle='#000';ctx.fillRect(bx-1,by-1,bw+2,bh+2);ctx.fillStyle='#e33';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#3e6';ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),bh);}
    } else if(this.type==='wolf'){ctx.fillStyle=fill||'#a08a70';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5a4a35';ctx.lineWidth=2;ctx.stroke();}
    else if(this.type==='gama'){ctx.fillStyle=fill||'#d97706';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7c2d12';ctx.lineWidth=3;ctx.stroke();}
    else if(this.type==='puppet_beast'){ctx.fillStyle=fill||'#7c2d12';ctx.fillRect(this.x-this.r,this.y-this.r,this.r*2,this.r*2);ctx.strokeStyle='#a16207';ctx.lineWidth=3;ctx.strokeRect(this.x-this.r,this.y-this.r,this.r*2,this.r*2);}
    ctx.globalAlpha=1;
  }
}

if(targetPlayers){for(const p of players){

class Zone{
  constructor(x,y,r,life,damage,color,owner,type='damage'){
    this.x=x;this.y=y;this.r=r;this.life=life;this.maxLife=life;this.damage=damage;this.color=color;this.owner=owner;
    this.tickTimer=0;this.type=type;this.triggered=false;this.triggerCount=0;this.maxTriggers=1;
    this.isDecoy=(type==='decoy');this.isAmaterasu=(type==='amaterasu');this.isParasite=(type==='parasite');this.isWindTrail=(type==='windtrail');this.isCrater=(type==='crater');
    this.isWindCircle=(type==='windCircle');this.isVortex=(type==='vortex');

        if(dist2(this,e)<this.r*this.r){

          if(this.isParasite&&!e.removed){e.parasiteTimer=Math.max(e.parasiteTimer,180);e.parasiteDamage=Math.max(e.parasiteDamage,this.damage*0.4);e.parasiteStacks=Math.min(5,(e.parasiteStacks||0)+1);}

      for(let i=0;i<7;i++){

        ctx.beginPath();ctx.arc(this.x+Math.cos(a)*rr,this.y+Math.sin(a)*rr,7,0,Math.PI*2);ctx.fill();
      }

      ctx.globalAlpha=alpha*0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.r*0.25,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;return;

      ctx.globalAlpha=1;return;

class TentenSeal{
  constructor(x,y,damage,owner){
    this.x=x;this.y=y;this.r=22;this.damage=damage;this.owner=owner;
    this.dead=false;this.armTime=15;
  }
  update(){
    if(this.dead)return false;
    if(this.armTime>0){this.armTime--;return true;}
    let hit=false;
    for(const e of enemies){if(e.removed)continue;if(Math.hypot(e.x-this.x,e.y-this.y)<this.r+e.r){hit=true;break;}}
    if(!hit)for(const b of bosses){if(b.removed)continue;if(Math.hypot(b.x-this.x,b.y-this.y)<this.r+b.r){hit=true;break;}}
    if(hit)this.detonate(1);
    return !this.dead;
  }
  detonate(mult){
    if(this.dead)return;
    this.dead=true;
    const radius=85;
    const att=this.owner;
    spawnShockwave(this.x,this.y,radius,'#f87171');
    spawnShockwave(this.x,this.y,radius*0.6,'#fbbf24');
    spawnParticles(this.x,this.y,'#fbbf24',20);
    spawnParticles(this.x,this.y,'#f87171',15);
    forEachEnemySnapshot(e=>{
      if(e.removed)return;
      if(Math.hypot(e.x-this.x,e.y-this.y)<radius+e.r){
        e.takeDamage(this.damage*mult,this.x,this.y,false,att);
        if(!e.removed&&!e.isBoss){const dx=e.x-this.x,dy=e.y-this.y,d=Math.hypot(dx,dy)||1;e.kx+=dx/d*25*Math.min(mult,3);e.ky+=dy/d*25*Math.min(mult,3);}
      }
    });
    screenShake=Math.max(screenShake,10*Math.min(mult,3));
    screenFlash=Math.max(screenFlash,6*Math.min(mult,3));
    if(mult>=3)hitStop=Math.max(hitStop,4);
    sfxBoom();
  }
  draw(){
    if(this.dead)return;
    const t=tickMs/200;
    const pulse=1+0.15*Math.sin(t);
    let alpha=1;
    if(this.armTime>0)alpha=0.4+0.4*(1-this.armTime/15);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#dc2626';
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*pulse,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha*0.95;
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(this.x-8,this.y);ctx.lineTo(this.x+8,this.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(this.x,this.y-8);ctx.lineTo(this.x,this.y+8);ctx.stroke();
    ctx.globalAlpha=alpha*0.9;
    ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*pulse+4,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
}

class TentenOrbitingSword{
  constructor(owner,offset){
    this.owner=owner;this.angle=tickMs/300;this.offset=offset;
    this.radius=90;this.life=360;
    this.damage=owner.getDamage()*2;
    this.hitCd={};
    this.x=owner.x+Math.cos(this.angle+offset)*this.radius;
    this.y=owner.y+Math.sin(this.angle+offset)*this.radius;
    this.dead=false;this.trail=[];this.r=15;
  }
  update(){
    this.life--;
    if(this.life<=0){this.dead=true;return false;}
    if(!this.owner.alive){this.dead=true;return false;}
    this.angle+=0.09;
    this.x=this.owner.x+Math.cos(this.angle+this.offset)*this.radius;
    this.y=this.owner.y+Math.sin(this.angle+this.offset)*this.radius;
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>16)this.trail.shift();
    forEachEnemySnapshot(e=>{
      if(e.removed)return;
      if(this.hitCd[e]&&this.hitCd[e]>tickMs)return;
      if(Math.hypot(e.x-this.x,e.y-this.y)<this.r+e.r){
        e.takeDamage(this.damage,this.x,this.y,false,this.owner);
        this.hitCd[e]=tickMs+280;
      }
    });
    return true;
  }
  draw(){
    for(let i=0;i<this.trail.length;i++){
      const tr=this.trail[i];
      const alpha=(i+1)/this.trail.length*0.7;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#e2e8f0';
      ctx.beginPath();ctx.arc(tr.x,tr.y,4-2*(1-i/this.trail.length),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle+this.offset+Math.PI/2);
    ctx.shadowColor='#a5f3fc';ctx.shadowBlur=10;
    ctx.fillStyle='#e2e8f0';
    ctx.beginPath();
    ctx.moveTo(0,-this.r*1.3);
    ctx.lineTo(this.r*0.35,this.r*0.6);
    ctx.lineTo(0,this.r);
    ctx.lineTo(-this.r*0.35,this.r*0.6);
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  }
}

class Tornado{
  constructor(x,y,damage,owner,life){
    this.x=x;this.y=y;this.damage=damage;this.owner=owner;
    this.life=life;this.maxLife=life;this.dead=false;
    this.r=110;this.hitRadius=55;this.tickTimer=0;
    const a=Math.random()*Math.PI*2;
    this.vx=Math.cos(a)*2.6;this.vy=Math.sin(a)*2.6;
    this.wanderTimer=Math.floor(rand(30,60));
  }
  update(){
    this.life--;
    if(this.life<=0){this.dead=true;return;}
    this.wanderTimer--;
    if(this.wanderTimer<=0){
      this.wanderTimer=Math.floor(rand(40,80));
      const a=Math.atan2(this.vy,this.vx)+rand(-0.8,0.8);
      const spd=rand(2,3.2);
      this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd;
    }
    const em=this.r;
    if(this.x<ARENA.x+em){this.x=ARENA.x+em;this.vx=Math.abs(this.vx);}
    else if(this.x>ARENA.x+ARENA.w-em){this.x=ARENA.x+ARENA.w-em;this.vx=-Math.abs(this.vx);}
    if(this.y<ARENA.y+em){this.y=ARENA.y+em;this.vy=Math.abs(this.vy);}
    else if(this.y>ARENA.y+ARENA.h-em){this.y=ARENA.y+ARENA.h-em;this.vy=-Math.abs(this.vy);}
    this.x+=this.vx;this.y+=this.vy;
    this.tickTimer++;
    const dmgTick=(this.tickTimer%18===0);
    forEachEnemySnapshot(e=>{
      if(e.removed)return;
      const dx=this.x-e.x,dy=this.y-e.y;
      const d=Math.hypot(dx,dy)||1;
      const pullMult=e.isBoss?0.15:1;
      if(d<this.r+e.r){const pull=1.4*pullMult*(1-d/(this.r+e.r));e.kx+=dx/d*pull*8;e.ky+=dy/d*pull*8;}
      if(dmgTick && d<this.hitRadius+e.r){e.takeDamage(this.damage,this.x,this.y,false,this.owner);}
    });
    if(this.tickTimer%3===0){const a=Math.random()*Math.PI*2;const rr=this.r*0.6;addTrail(this.x+Math.cos(a)*rr,this.y+Math.sin(a)*rr,'#a5f3fc',6);}
  }
  draw(){
    const alpha=Math.min(1,this.life/30);const rot=tickMs/80;
    ctx.globalAlpha=alpha;
    for(let ring=0;ring<3;ring++){
      const rr=this.r-ring*22;if(rr<=0)continue;
      ctx.strokeStyle=ring===0?'#67e8f9':'#a5f3fc';ctx.lineWidth=ring===0?4:2;
      const startA=rot*(1+ring*0.5)+ring*1.7;
      ctx.beginPath();ctx.arc(this.x,this.y,rr,startA,startA+Math.PI*1.6);ctx.stroke();
    }
    ctx.globalAlpha=alpha*0.4;ctx.fillStyle='#67e8f9';
    const coreR=this.hitRadius*0.6+Math.sin(tickMs/60)*4;
    ctx.beginPath();ctx.arc(this.x,this.y,coreR,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=alpha*0.85;
    for(let i=0;i<6;i++){const a=rot*1.5+i*Math.PI/3;const rr=this.r*0.7+Math.sin(rot*2+i)*8;ctx.fillStyle='#a5f3fc';ctx.beginPath();ctx.arc(this.x+Math.cos(a)*rr,this.y+Math.sin(a)*rr,3,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  }
}

class ANBU{
  constructor(x,y,owner){
    this.x=x;this.y=y;this.owner=owner;this.hp=80;this.maxHp=80;this.r=12;this.speed=3.2;

    for(const e of enemies){const dx=this.x-e.x,dy=this.y-e.y;const d=Math.hypot(dx,dy);if(d<160){fleeX+=dx/(d||1);fleeY+=dy/(d||1);fleeCount++;}}
    for(const b of bosses){const dx=this.x-b.x,dy=this.y-b.y;const d=Math.hypot(dx,dy);if(d<240){fleeX+=dx/(d||1);fleeY+=dy/(d||1);fleeCount++;}}
    let mx=0,my=0;
    if(fleeCount>0){const fl=Math.hypot(fleeX,fleeY);mx=fleeX/fl*this.speed;my=fleeY/fl*this.speed;}
    else if(tgt&&Math.hypot(tgt.x-this.x,tgt.y-this.y)<250){
      const dx=tgt.x-this.x,dy=tgt.y-this.y;const d=Math.hypot(dx,dy)||1;
      const perpX=-dy/d,perpY=dx/d;const backoff=(d<280)?-0.6:0.4;
      mx=(dx/d*backoff+perpX*0.9)*this.speed;my=(dy/d*backoff+perpY*0.9)*this.speed;
    } else {
      this.wanderTimer--;if(this.wanderTimer<=0){this.wanderAngle=Math.random()*Math.PI*2;this.wanderTimer=Math.floor(rand(60,120));}
      mx=Math.cos(this.wanderAngle)*this.speed*0.7;my=Math.sin(this.wanderAngle)*this.speed*0.7;
    }
    const em=80;
    if(this.x<ARENA.x+em)mx+=1.5;if(this.x>ARENA.x+ARENA.w-em)mx-=1.5;
    if(this.y<ARENA.y+em)my+=1.5;if(this.y>ARENA.y+ARENA.h-em)my-=1.5;
    this.x+=mx;this.y+=my;
    this.x=clamp(this.x,ARENA.x+this.r,ARENA.x+ARENA.w-this.r);this.y=clamp(this.y,ARENA.y+this.r,ARENA.y+ARENA.h-this.r);
    if(this.shootTimer>0)this.shootTimer--;
    if(this.shootTimer===0&&tgt){
      const ang=Math.atan2(tgt.y-this.y,tgt.x-this.x);
      const proj=new Projectile(this.x,this.y,ang,this.owner.getDamage()*0.6,'#888',5,11);
      proj.attacker=this.owner;projectiles.push(proj);this.shootTimer=60;
    }
  }
  takeDamage(d){if(!this.alive)return;this.hp-=d;this.hurtFlash=6;if(this.hp<=0){this.hp=0;this.alive=false;spawnShockwave(this.x,this.y,60,'#444');spawnParticles(this.x,this.y,'#444',20);}}
  draw(){
    if(!this.alive)return;
    const fill=this.hurtFlash>0?'#fff':'#2a2a2a';
    ctx.fillStyle=fill;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(this.x,this.y-2,this.r*0.55,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(this.x-3,this.y-2,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(this.x+3,this.y-2,1.5,0,Math.PI*2);ctx.fill();
    if(this.hp<this.maxHp){const bw=24,bh=3;const bx=this.x-bw/2,by=this.y-this.r-6;ctx.fillStyle='#000';ctx.fillRect(bx-1,by-1,bw+2,bh+2);ctx.fillStyle='#e33';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#3e6';ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),bh);}
  }
}

// ==================== SPAWN MARKER / DISSOLVE / WAVE SYSTEM ====================
function drawSpawnMarker(m){
  const t=1-m.timer/m.maxTimer;
  const isBossMarker=!!m.isBoss;const isSpecial=!!m.specialType||isBossMarker;
  const color=isBossMarker?'#ff6600':(isSpecial?'#ffd700':'#ff3333');
  const pulse=22+4*Math.sin(tickMs/80)+(isBossMarker?15:0);const outerR=26+(isBossMarker?15:0);
  ctx.globalAlpha=0.3+0.4*Math.sin(tickMs/100);ctx.strokeStyle=color;ctx.lineWidth=isBossMarker?5:3;
  ctx.beginPath();ctx.arc(m.x,m.y,pulse,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=0.4;ctx.fillStyle=color;ctx.beginPath();ctx.arc(m.x,m.y,pulse*t,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(m.x,m.y,outerR,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font=isBossMarker?'bold 20px monospace':'bold 14px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const icon=isBossMarker?'☠':(isSpecial?'★':'!');ctx.fillText(icon,m.x,m.y);
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
}

function dissolveEnemy(e){
  if(e.removed)return;
  for(const p of players){if(!p.alive)continue;let base=e.specialType?(12+Math.floor(wave*1.5)):(e.type==='tank'?(6+wave):(3+Math.floor(wave/2)));if(e.isMinion)base=Math.max(1,Math.floor(base*0.4));p.coins+=base;
    if(p.hook&&p.hook.type==='kyuubiCloak')p.hookValue=Math.min(8,p.hookValue+1);
    if(p.charId==='tenten'){p.tentenAmmo[p.tentenAmmoType||0]=Math.min(20,(p.tentenAmmo[p.tentenAmmoType||0]||0)+3);}
  }
  for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,sp=rand(1,3);emitParticle(e.x,e.y,Math.cos(a)*sp,Math.sin(a)*sp,32,'#888',rand(2,4));}
  spawnShockwave(e.x,e.y,e.r*3,'#666');
  removeEnemy(e);
}

function clearMap(){
chibakuBalls.length=0;
  for(const p of particles)_particlePool.push(p);
  for(const d of damageNumbers)_damageNumberPool.push(d);
  enemies.length=0;projectiles.length=0;enemyProjectiles.length=0;
  particles.length=0;clones.length=0;zones.length=0;pets.length=0;
  beams.length=0;mines.length=0;tornadoes.length=0;
  bosses.length=0;telegraphs.length=0;cocoons.length=0;swarms.length=0;
  tentenSeals.length=0;tentenSwords.length=0;
  whiteFangSwords.length=0;
  damageNumbers.length=0;shockwaves.length=0;trails.length=0;
  beamWarnings.length=0;spawnMarkers.length=0;
  pendingActions.length=0;
  screenFlash=0;screenShake=0;hitStop=0;killFlash=0;waveBannerTimer=0;allDeadTimer=0;
}
function startRun(m,c1,c2){
  mode=m;wave=0;paused=false;
  enemyTier=0;enemyTierBannerTimer=0;
  phase='normal';defenseWave=0;defenseFailCount=0;defenseOutcome=null;
  applyPhaseArena();
  clearMap();autoChoiceState=null;waveClearTimer=0;allDeadTimer=0;anbuSquads=[];
  const cx=W/2,cy=H/2;
  if(mode===1){players=[new Player(cx,cy,c1,{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'},0,false)];}
  else{players=[new Player(cx-80,cy,c1,{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'},0,false),new Player(cx+80,cy,c2,{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'},1,false)];}
  if(mode===2){players[0].dashKeys=['ShiftLeft'];players[1].dashKeys=['ShiftRight'];}
  nextWave();state='playing';
}
function getSpawnIntervalFrames(w){const s=Math.max(0.4,2.0-w*0.10);return Math.floor(s*60);}
function scheduleEnemySpawn(){
  const pos=edgeSpawn();
  let type=pickEnemyType(),specialType=null;
  if(wave>=3&&Math.random()<0.10+wave*0.012){specialType=SPECIAL_KEYS[Math.floor(Math.random()*SPECIAL_KEYS.length)];type='grunt';}
  spawnMarkers.push({x:pos.x,y:pos.y,timer:40,maxTimer:40,type,specialType,wave});
}
function spawnDefenseRound(){
  clearMap();
  respawnAkamaru();    // ← Акамару возвращается каждый раунд
  respawnWhiteFangSwords();  // ← клинки Белого Клыка   // ← Акамару возвращается каждый раунд
  waveTimer=0;spawnTimer=0;waveEnded=false;
  bossWaveActive=false;

  // Небольшая неуязвимость после смены раунда
  for(const p of players){
    if(!p.alive)continue;
    p.invuln=Math.max(p.invuln,60);
  }

  const isFinalDef = defenseWave >= DEFENSE_TOTAL_WAVES;
  const count      = Math.min(isFinalDef ? (10 + wave*2) : (6 + wave*2), 80);
  const spawnDelay = isFinalDef ? 18 : 25;
  const spawnStep  = isFinalDef ? 6  : 8;
  const forcedSpecials = isFinalDef ? 3 : 0;
  const baseChance = isFinalDef ? 0.20 : 0.08;
  let specialsSpawned = 0;

  for(let i=0;i<count;i++){
    const pos=edgeSpawn();
    let type=pickEnemyType(),specialType=null;
    const rollSpecial = (specialsSpawned < forcedSpecials) || (wave>=3 && Math.random()<baseChance+wave*0.01);
    if(rollSpecial){
      specialType=SPECIAL_KEYS[Math.floor(Math.random()*SPECIAL_KEYS.length)];
      type='grunt';
      specialsSpawned++;
    }
    spawnMarkers.push({x:pos.x,y:pos.y,timer:spawnDelay+i*spawnStep,maxTimer:spawnDelay+i*spawnStep,type,specialType,wave});
  }

  waveBannerSpecial=true;
  waveBannerTimer = isFinalDef ? 180 : 100;
  waveBannerMax   = waveBannerTimer;
  waveClearTimer=0;
  sfxWave();
  if(isFinalDef){
    sfx(180,0.5,0.15,'sawtooth',0.4);
    screenFlash=Math.max(screenFlash,20);
    screenShake=Math.max(screenShake,15);
  }
}
function respawnAkamaru(){
  for(const p of players){
    if(p.charId!=='kiba')continue;
    if(p.akamaruDeadCd>0)continue;
    const has=pets.some(pt=>pt.type==='akamaru'&&pt.owner===p&&pt.hp>0);
    if(!has){
      const pet=new Pet(p.x+30,p.y+30,p,'akamaru');
      pet.hp=pet.maxHp;
      pets.push(pet);
    }
  }
}
function respawnWhiteFangSwords(){
  for(const p of players){
    if(!p.alive)continue;
    const count=p.getArtifactStack('whiteFangTanto');
    for(let i=0;i<count;i++){
      const ang=Math.random()*Math.PI*2;
      const r=Math.min(ARENA.w,ARENA.h)*0.3;
      const sx=clamp(ARENA.x+ARENA.w/2+Math.cos(ang)*r,ARENA.x+80,ARENA.x+ARENA.w-80);
      const sy=clamp(ARENA.y+ARENA.h/2+Math.sin(ang)*r,ARENA.y+80,ARENA.y+ARENA.h-80);
      whiteFangSwords.push({x:sx,y:sy,owner:p});
    }
  }
}
function nextWave(){
  wave++;
  DEFENSE_FAIL_MAX = 10 + Math.floor(wave / 4) * 2;  // wave 20 → 20, wave 40 → 30
  sasukeChoiceNeeded = players.some(p=>p.charId==='sasuke');
  updateEnemyTier();
  const info=getPhaseInfo(wave);
  phase=info.phase;
  defenseWave=info.defenseWave;
  applyPhaseArena();
  // Клэмпим игроков и АНБУ в новую арену
  for(const p of players){
    if(!p.alive)continue;
    p.x=clamp(p.x,ARENA.x+p.r,ARENA.x+ARENA.w-p.r);
    p.y=clamp(p.y,ARENA.y+p.r,ARENA.y+ARENA.h-p.r);
  }
  for(const squad of anbuSquads){
    for(const a of squad.members){
      if(!a.alive)continue;
      a.x=clamp(a.x,ARENA.x+a.r,ARENA.x+ARENA.w-a.r);
      a.y=clamp(a.y,ARENA.y+a.r,ARENA.y+ARENA.h-a.r);
    }
  }
  clearMap();
  waveTimer=0;spawnTimer=0;waveEnded=false;

  if(wave>1){const bonus=30+wave*8;for(const p of players){if(p.alive)p.coins+=bonus;}}
  if(wave%BOSS_EVERY===BOSS_EVERY-1){
    for(const p of players){if(p.alive){p.coins+=150;spawnDamageNumber(p.x,p.y-60,'+150💰 ПЕРЕД БОССОМ','#ffd700',true);}}
  }

  for(const p of players)p.resetWaveState();
  respawnAkamaru();
  respawnWhiteFangSwords();   // ← респавним ДО ветвления по фазам
  for(const p of players){if(!p.alive){p.alive=true;p.hp=Math.max(1,p.maxHp*0.4);p.invuln=120;}else p.invuln=Math.max(p.invuln,90);}
  for(const squad of anbuSquads){for(const a of squad.members){if(a.alive)a.hp=a.maxHp;}}

  // ==================== БОСС ====================
  if(phase==='boss'){
    bossWaveActive=true;
    const cycle=Math.floor((wave-1)/BOSS_EVERY);
    const idx=cycle%BOSS_KEYS.length;
    const bossKey=BOSS_KEYS[idx];
    const pos=edgeSpawn();
    spawnMarkers.push({x:pos.x,y:pos.y,timer:90,maxTimer:90,isBoss:true,bossKey,wave});
    waveBannerSpecial=true;waveBannerTimer=200;waveBannerMax=200;waveClearTimer=0;
    sfxWave();
    return;
  }

  // ==================== ОБОРОНА (вся волна = 4 раунда) ====================
  if(phase==='defense'){
    defenseWave=1;
    defenseFailCount=0;   // сброс при входе в новый блок обороны
    spawnDefenseRound();
    return;
  }
  // ==================== ОБЫЧНАЯ ВОЛНА ====================
  respawnWhiteFangSwords();
  bossWaveActive=false;
  const initial=5+Math.min(7,Math.floor(wave/2));
  for(let i=0;i<initial;i++)scheduleEnemySpawn();
  spawnTimer=getSpawnIntervalFrames(wave);
  waveBannerSpecial=false;waveBannerTimer=100;waveBannerMax=100;waveClearTimer=0;
  sfxWave();
}
function pickEnemyType(){
  const r=Math.random();
  if(wave>=6&&r<0.05)return 'summoner';
  if(wave>=4&&r<0.13)return 'charger';
  if(wave>=3&&r<0.22)return 'ranger';
  if(wave>=2&&r<0.30)return 'kamikaze';
  if(wave>=5&&r<0.35)return 'healer2';
  if(wave>=3&&r<0.48)return 'tank';
  if(wave>=2&&r<0.65)return 'fast';
  return 'grunt';
}
function edgeSpawn(){
  if(phase==='defense'){
    return {x:ARENA.x+30, y:rand(ARENA.y+40, ARENA.y+ARENA.h-40)};
  }
  const s=Math.floor(Math.random()*4);
  if(s===0)return{x:rand(ARENA.x+30,ARENA.x+ARENA.w-30),y:ARENA.y+20};
  if(s===1)return{x:rand(ARENA.x+30,ARENA.x+ARENA.w-30),y:ARENA.y+ARENA.h-20};
  if(s===2)return{x:ARENA.x+20,y:rand(ARENA.y+30,ARENA.y+ARENA.h-30)};
  return{x:ARENA.x+ARENA.w-20,y:rand(ARENA.y+30,ARENA.y+ARENA.h-30)};
}

function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.9;p.vy*=0.9;p.life--;if(p.life<=0){_particlePool.push(p);particles.splice(i,1);}}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function updateDamageNumbers(){for(let i=damageNumbers.length-1;i>=0;i--){const d=damageNumbers[i];d.y+=d.vy;d.vy*=0.94;d.life--;if(d.life<=0){_damageNumberPool.push(d);damageNumbers.splice(i,1);}}}
function drawDamageNumbers(){for(const d of damageNumbers){const a=d.life/d.maxLife;ctx.globalAlpha=a;const size=d.isCrit?26:18;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(d.amount,d.x+d.offset,d.y);ctx.fillStyle=d.color;ctx.fillText(d.amount,d.x+d.offset,d.y);}ctx.globalAlpha=1;ctx.textAlign='left';}
function updateShockwaves(){for(let i=shockwaves.length-1;i>=0;i--){const s=shockwaves[i];s.r+=(s.maxR-s.r)*0.25;s.life--;if(s.life<=0)shockwaves.splice(i,1);}}
function drawShockwaves(){for(const s of shockwaves){const a=s.life/s.maxLife;ctx.globalAlpha=a*0.7;ctx.strokeStyle=s.color;ctx.lineWidth=3*a+1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;}
function updateTrails(){for(let i=trails.length-1;i>=0;i--){trails[i].life--;if(trails[i].life<=0)trails.splice(i,1);}}
function drawTrails(){for(const t of trails){ctx.globalAlpha=(t.life/t.maxLife)*0.5;ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}

function updatePlaying(){
if(sasukeChoiceNeeded){ state='sasukeMode'; return; }
  if(mouse.clicked&&isPauseHover()){paused=true;return;}
  if(!players.some(p=>p.alive)){allDeadTimer++;if(allDeadTimer>=60){allDeadTimer=0;state='dead';return;}}else{allDeadTimer=0;}
  const frozen=hitStop>0;if(frozen)hitStop--;
  if(!frozen){
    if(!bossWaveActive&&!waveEnded&&phase==='normal'){
      waveTimer++;spawnTimer--;
      if(spawnTimer<=0){
        if(enemies.length+bosses.length<50)scheduleEnemySpawn();
        spawnTimer=getSpawnIntervalFrames(wave);
      }
      if(waveTimer>=WAVE_DURATION){
        waveEnded=true;
        for(let i=spawnMarkers.length-1;i>=0;i--){const m=spawnMarkers[i];if(!m.isBoss&&!m.specialType)spawnMarkers.splice(i,1);}
        const regularCount=enemies.filter(e=>!e.specialType&&!e.removed).length;
        for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(!e.specialType)dissolveEnemy(e);}
        if(regularCount>0){screenFlash=25;screenShake=Math.max(screenShake,10);spawnShockwave(W/2,H/2,600,'#ffd700');spawnDamageNumber(W/2,H/2-120,'ВОЛНА ЗАВЕРШЕНА','#ffd700',true);}
      }
    }
    for(let i=spawnMarkers.length-1;i>=0;i--){
      const m=spawnMarkers[i];m.timer--;
      if(m.timer<=0){
        if(m.isBoss){bosses.push(new Boss(m.x,m.y,m.bossKey,m.wave));spawnShockwave(m.x,m.y,200,'#ff3030');spawnParticles(m.x,m.y,'#ff3030',60);screenFlash=30;screenShake=20;}
        else{const e=new Enemy(m.x,m.y,m.type,m.wave,m.specialType);enemies.push(e);spawnShockwave(m.x,m.y,60,m.specialType?'#ffd700':'#ff3333');spawnParticles(m.x,m.y,m.specialType?'#ffd700':'#ff3333',15);}
        spawnMarkers.splice(i,1);
      }
    }
    for(const p of players)p.update();
    forEachEnemySnapshot(e=>e.update());
    for(const squad of anbuSquads){for(const a of squad.members)a.update();}
    for(let i=projectiles.length-1;i>=0;i--){projectiles[i].update();if(projectiles[i].dead)projectiles.splice(i,1);}
    for(let i=enemyProjectiles.length-1;i>=0;i--){enemyProjectiles[i].update();if(enemyProjectiles[i].dead)enemyProjectiles.splice(i,1);}
    for(let i=clones.length-1;i>=0;i--)if(!clones[i].update())clones.splice(i,1);
    for(let i=pets.length-1;i>=0;i--)if(!pets[i].update())pets.splice(i,1);
    for(let i=zones.length-1;i>=0;i--)if(!zones[i].update())zones.splice(i,1);
    for(let i=chibakuBalls.length-1;i>=0;i--){if(!chibakuBalls[i].update())chibakuBalls.splice(i,1);}
    for(let i=mines.length-1;i>=0;i--){mines[i].update();if(mines[i].dead)mines.splice(i,1);}
    for(let i=tornadoes.length-1;i>=0;i--){tornadoes[i].update();if(tornadoes[i].dead)tornadoes.splice(i,1);}
    for(let i=tentenSeals.length-1;i>=0;i--){if(!tentenSeals[i].update())tentenSeals.splice(i,1);}
    for(let i=tentenSwords.length-1;i>=0;i--){if(!tentenSwords[i].update())tentenSwords.splice(i,1);}
    for(let i=cocoons.length-1;i>=0;i--){if(!cocoons[i].update())cocoons.splice(i,1);}
    for(let i=swarms.length-1;i>=0;i--){if(!swarms[i].update())swarms.splice(i,1);}
    for(let i=beams.length-1;i>=0;i--){beams[i].update();if(beams[i].dead)beams.splice(i,1);}
    for(let i=beamWarnings.length-1;i>=0;i--){beamWarnings[i].update();if(beamWarnings[i].dead)beamWarnings.splice(i,1);}
    for(let i=bosses.length-1;i>=0;i--)bosses[i].update();
    for(let i=telegraphs.length-1;i>=0;i--){telegraphs[i].update();if(telegraphs[i].dead)telegraphs.splice(i,1);}
    updatePendingActions();
    updateParticles();updateDamageNumbers();updateShockwaves();updateTrails();
  }
  if(screenFlash>0)screenFlash--;
  if(screenShake>0)screenShake--;
  if(killFlash>0)killFlash--;
  if(waveBannerTimer>0)waveBannerTimer--;
  if(enemyTierBannerTimer>0)enemyTierBannerTimer--;
  _tacticsCache = getPlayerTactics();
  const noEnemies=enemies.length===0&&bosses.length===0&&spawnMarkers.length===0;
  if(phase==='defense'){
    if(noEnemies){
      waveClearTimer++;
      if(waveClearTimer>=30){
        waveClearTimer=0;
        if(defenseWave>=DEFENSE_TOTAL_WAVES){
          // 4-й раунд отбит — теперь апгрейд
          state='upgrade';
        } else {
          // Следующий раунд подряд, БЕЗ апгрейда
          defenseWave++;
          spawnDefenseRound();
        }
      }
    } else waveClearTimer=0;
  } else if(bossWaveActive){
    if(bosses.length===0&&spawnMarkers.length===0){waveClearTimer++;if(waveClearTimer>=30){waveClearTimer=0;state='upgrade';}}
    else waveClearTimer=0;
  } else if(waveEnded&&noEnemies){
    waveClearTimer++;if(waveClearTimer>=30){waveClearTimer=0;state='upgrade';}
  } else waveClearTimer=0;
}

function getAutoChoicesForPlayer(p){
  const isMelee=!!p.character.meleeAuto;
  const isTenten=p.charId==='tenten';
  const meleeBlacklist=['ricochet','pierce'];
  const circularActive=p.autoUpgrades.circular>0;
  const projectileActive=p.autoUpgrades.ricochet>0||p.autoUpgrades.explosive>0||p.autoUpgrades.knockback>0||p.autoUpgrades.slow>0||p.autoUpgrades.pierce>0;
  const avail=[];
  for(const key of AUTO_KEYS){
    if(p.autoUpgrades[key]>=3)continue;
    if(isMelee&&meleeBlacklist.includes(key))continue;
    if(isTenten&&key==='circular')continue;
    if(circularActive&&key!=='circular'&&key!=='cdOnKill'&&key!=='mines')continue;
    if(projectileActive&&key==='circular')continue;
    avail.push(key);
  }
  if(avail.length===0)return[];
  fisherYates(avail);
  return avail.slice(0,Math.min(3,avail.length));
}
function beginAutoUpgradeSelection(){
  if(autoChoiceState!==null)return;
  const autoApplied=[],needChoice=[];
  for(const p of players){
    if(p.currentAutoKey&&p.autoUpgrades[p.currentAutoKey]<3){p.autoUpgrades[p.currentAutoKey]++;autoApplied.push(p.id);}
    else{p.currentAutoKey=null;const avail=AUTO_KEYS.filter(k=>p.autoUpgrades[k]<3);if(avail.length>0)needChoice.push(p.id);}
  }
  if(autoApplied.length>0){autoChoiceState={phase:'applied',autoApplied,needChoice,choicesPerPlayer:null,turn:0};}
  else if(needChoice.length>0){const picks=players.map(p=>(needChoice.includes(p.id))?getAutoChoicesForPlayer(p):null);autoChoiceState={phase:'choice',turn:0,needChoice,choicesPerPlayer:picks,autoApplied:[]};}
  else{nextWave();state='playing';return;}
  state='autoUpgrade';
}

      else{autoChoiceState=null;nextWave();state='playing';}
    }

  }
  const activeList=autoChoiceState.needChoice;
  if(autoChoiceState.turn>=activeList.length){autoChoiceState=null;nextWave();state='playing';return;}
  const activeIdx=activeList[autoChoiceState.turn];const activeP=players[activeIdx];
  const choices=autoChoiceState.choicesPerPlayer[activeIdx];if(!choices||choices.length===0){autoChoiceState.turn++;return;}
  const cardW=320,cardH=400,gap=40;const totalW=cardW*3+gap*2;const startX=(W-totalW)/2,cardY=180;

function drawDashIndicator(p,x,y,align){
  const dotR=7,dotGap=6;
  const dotW=dotR*2+dotGap;
  const label='РЫВОК ';
  ctx.font='bold 12px monospace';
  const labelW=ctx.measureText(label).width;
  const totalW=labelW+p.maxDashCharges*dotW;
  const startX=(align==='right')?x-totalW:x;
  const dotsStartX=startX+labelW;
  ctx.textAlign='left';
  ctx.fillStyle='#a5f3fc';
  ctx.fillText(label,startX,y+4);
  for(let i=0;i<p.maxDashCharges;i++){
    const cx=dotsStartX+i*dotW+dotR;
    const cy=y;
    if(i<p.dashCharges){
      ctx.fillStyle='#67e8f9';
      ctx.beginPath();ctx.arc(cx,cy,dotR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
    } else {
      ctx.strokeStyle='#555';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,dotR,0,Math.PI*2);ctx.stroke();
    }
  }
  if(p.dashCharges<p.maxDashCharges){
    const prog=p.dashRechargeTimer/(15*60);
    const cx=dotsStartX+p.dashCharges*dotW+dotR;
    ctx.strokeStyle='#67e8f9';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,y,dotR-1,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);ctx.stroke();
  }
}
